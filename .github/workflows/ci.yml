name: Collection CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra scraping --extra wayback
      - run: uv run ruff check scripts/collect/selection_audit scripts/collect/wayback tests
      - run: uv run ruff format --check scripts/collect/selection_audit scripts/collect/wayback tests
      - run: uv run pytest -q
